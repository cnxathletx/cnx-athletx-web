name: CI and Deploy

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Lint and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  preview-worker:
    name: Deploy Preview Worker
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sanitize branch name
        id: branch
        run: |
          BRANCH="${{ github.head_ref }}"
          SANITIZED=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//' | cut -c1-28)
          echo "sanitized=$SANITIZED" >> "$GITHUB_OUTPUT"
          echo "pages_url=https://${SANITIZED}.cnx-athletx-web.pages.dev" >> "$GITHUB_OUTPUT"

      - name: Deploy preview Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 0ccff0e0abbbf8d1395557afe2cf9a42
          command: deploy --config packages/api/wrangler.toml --env preview --var ALLOWED_ORIGINS:${{ steps.branch.outputs.pages_url }}

  preview-pages:
    name: Deploy Preview Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sanitize branch name
        id: branch
        run: |
          BRANCH="${{ github.head_ref }}"
          SANITIZED=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//' | cut -c1-28)
          echo "sanitized=$SANITIZED" >> "$GITHUB_OUTPUT"

      - name: Build web package
        run: npm run build:web
        env:
          VITE_API_BASE_URL: https://cnx-athletx-api-preview.athletx-cnx.workers.dev

      - name: Deploy preview Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 0ccff0e0abbbf8d1395557afe2cf9a42
          command: pages deploy packages/web/dist --project-name cnx-athletx-web --branch ${{ steps.branch.outputs.sanitized }}

  comment-preview-urls:
    name: Comment Preview URLs
    runs-on: ubuntu-latest
    needs: [preview-worker, preview-pages]
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
    steps:
      - name: Sanitize branch name
        id: branch
        run: |
          BRANCH="${{ github.head_ref }}"
          SANITIZED=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g' | sed 's/--*/-/g' | sed 's/^-//' | sed 's/-$//' | cut -c1-28)
          echo "sanitized=$SANITIZED" >> "$GITHUB_OUTPUT"

      - name: Find or create PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: preview-urls
          message: |
            ## Preview Deployment

            | Service | URL |
            |---------|-----|
            | Frontend | https://${{ steps.branch.outputs.sanitized }}.cnx-athletx-web.pages.dev |
            | API | https://cnx-athletx-api-preview.athletx-cnx.workers.dev |

            _Updated at: ${{ github.event.pull_request.updated_at || github.event.head_commit.timestamp }}_

  deploy-pages:
    name: Deploy Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web package
        run: npm run build:web

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 0ccff0e0abbbf8d1395557afe2cf9a42
          command: pages deploy packages/web/dist --project-name cnx-athletx-web

  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 0ccff0e0abbbf8d1395557afe2cf9a42
          command: deploy --config packages/api/wrangler.toml --env production
