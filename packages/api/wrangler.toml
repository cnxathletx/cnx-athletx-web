name = "cnx-athletx-api"
main = "src/index.ts"
compatibility_date = "2026-02-25"
account_id = "0ccff0e0abbbf8d1395557afe2cf9a42"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "http://localhost:5171,http://localhost:4173"

[[d1_databases]]
binding = "DB"
database_name = "cnx-athletx-dev"
database_id = "805d023a-2d77-4aef-95eb-164a82201962"
preview_database_id = "805d023a-2d77-4aef-95eb-164a82201962"

[[r2_buckets]]
binding = "PRODUCT_IMAGES"
bucket_name = "cnx-product-images-dev"
